name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            ext: ""
          - goos: windows
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Go 1.26
        uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26

      - name: Build binary
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=amd64 go build -o dist/goclone-${{ matrix.goos }}-amd64${{ matrix.ext }} ./cmd/goclone

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: goclone-${{ matrix.goos }}-amd64
          path: dist/goclone-${{ matrix.goos }}-amd64${{ matrix.ext }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Go 1.26
        uses: actions/setup-go@v6.4.0
        with:
          go-version: 1.26

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
